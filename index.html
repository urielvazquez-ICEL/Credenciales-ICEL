<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Credenciales - Universidad ICEL</title>
    <!-- Bootstrap para estilos rápidos y FontAwesome para iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; }
        .credencial-preview {
            width: 320px;
            height: 480px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            margin: 0 auto;
            padding: 20px;
            border-top: 10px solid #0056b3; /* Color ICEL */
            text-align: center;
            position: relative;
        }
        .foto-placeholder {
            width: 120px;
            height: 140px;
            background-color: #e9ecef;
            margin: 15px auto;
            border: 2px dashed #adb5bd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row">
        <!-- Columna Izquierda: Formulario y Login -->
        <div class="col-md-6">
            <h2 class="mb-4">Generación de Credencial ICEL</h2>
            <p>Inicia sesión con tu correo institucional para comenzar.</p>

            <!-- Botón de Google SSO -->
            <div id="g_id_onload"
                 data-client_id="574467361695-p1dlunuro7o9kmm22c395f3c77e7eg6k.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin mb-4"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>

            <!-- Datos del Usuario -->
            <div class="card mb-4 p-3 shadow-sm">
                <p id="userEmailDisplay" class="text-primary fw-bold mb-2">
                    <i class="fa-solid fa-envelope"></i> Esperando inicio de sesión...
                </p>
                <form id="credencialForm">
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" id="inputNombre" class="form-control" readonly placeholder="Se autocompletará con Google">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Matrícula</label>
                        <input type="text" id="inputMatricula" class="form-control" placeholder="Ingresa tu matrícula" onkeyup="updateCardData()">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Licenciatura / Área</label>
                        <input type="text" id="inputCarrera" class="form-control" placeholder="Ej. Ingeniería en Sistemas" onkeyup="updateCardData()">
                    </div>
                </form>
            </div>
        </div>

        <!-- Columna Derecha: Vista Previa de la Credencial -->
        <div class="col-md-6">
            <h4 class="text-center mb-4">Vista Previa</h4>
            <div class="credencial-preview">
                <h5 class="mt-2 fw-bold" style="color: #0056b3;">Universidad ICEL</h5>
                <p class="small text-muted">Campus La Villa</p>
                <div class="foto-placeholder">
                    <i class="fa-solid fa-user fa-3x"></i>
                </div>
                <h5 id="cardNombre" class="mt-3">Nombre del Alumno</h5>
                <p id="cardMatricula" class="mb-1 fw-bold">Matrícula: -------</p>
                <p id="cardCarrera" class="small text-muted">Licenciatura</p>
                
                <!-- Espacio para futuro QR -->
                <div class="mt-4">
                    <i class="fa-solid fa-qrcode fa-3x text-muted"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Contenedor de Notificaciones (Toasts) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header bg-success text-white">
            <i class="fa-solid fa-check-circle me-2"></i>
            <strong class="me-auto" id="toastTitle">Notificación</strong>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toastMessage">
            Mensaje
        </div>
    </div>
</div>

<!-- Scripts de Google y Bootstrap -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Decodificar el token de Google
    function decodeJwtResponse(token) {
        let base64Url = token.split('.')[1];
        let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    // Procesar el inicio de sesión
    function handleCredentialResponse(response) {
        const payload = decodeJwtResponse(response.credential);
        const email = payload.email;

        // FILTRO DE SEGURIDAD: Solo correos ICEL
        if (!email.endsWith('@alumnos.icel.edu.mx') && !email.endsWith('@icel.edu.mx')) {
            alert('Acceso denegado. Este portal es exclusivo para estudiantes y personal de ICEL con correo institucional.');
            location.reload(); 
            return; 
        }

        // Llenar datos si pasa el filtro
        document.getElementById('inputNombre').value = payload.name;
        document.getElementById('userEmailDisplay').innerHTML = `<i class="fa-solid fa-envelope"></i> ` + email;
        
        updateCardData();
        showToast('Bienvenido', 'Has iniciado sesión exitosamente como comunidad ICEL.');
    }

    // Actualizar la vista previa de la credencial
    function updateCardData() {
        let nombre = document.getElementById('inputNombre').value;
        let matricula = document.getElementById('inputMatricula').value;
        let carrera = document.getElementById('inputCarrera').value;

        document.getElementById('cardNombre').innerText = nombre || "Nombre del Alumno";
        document.getElementById('cardMatricula').innerText = matricula ? "Matrícula: " + matricula : "Matrícula: -------";
        document.getElementById('cardCarrera').innerText = carrera || "Licenciatura";
    }

    // Mostrar notificaciones Toast
    function showToast(title, message) {
        document.getElementById('toastTitle').innerText = title;
        document.getElementById('toastMessage').innerText = message;
        const toastElement = document.getElementById('liveToast');
        const toast = new bootstrap.Toast(toastElement);
        toast.show();
    }
</script>

</body>
</html>
